<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title></title>
        <link id="favicon" rel="icon">
        <style>
            body {
                background-color: white;
                height: 100vh;
                margin: 0;
            }
            #text {
                font-size: 96px;
                font-family: Arial,serif;
                border: 1px solid lightgrey;
                border-radius: 5px;
                overflow: hidden;
            }

            body {
                position: relative;
            }
            #container {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            #span {
                visibility: hidden;
                white-space: pre;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <textarea id="text" oninput="update()" aria-label=""></textarea>
            <br/>
            <span id="span"></span>
        </div>
    </body>
    <script type="text/javascript">
        const hash  = (window.location.hash || '#').slice(1);
        const input = document.getElementById('text');
        const span = document.getElementById('span');

        if (hash === '') {
            input.focus();
        } else {
            input.value = decodeURI(hash);
        }

        const separator = " ";
        const linesSeparator = "\n";
        const getWidth = text => {
            span.innerHTML = text;
            return span.getBoundingClientRect().width;
        }
        const getHeight = text => {
            span.innerHTML = text;
            return span.getBoundingClientRect().height;
        };
        const text = () => input.value.replaceAll(linesSeparator, separator);
        const asyncResult = async (fn, check, intervalMs = 100) => new Promise((resolve) => {
            const interval = window.setInterval(
                () => {
                    const result = fn();
                    if (check(result)) {
                        window.clearInterval(interval);
                        resolve(result);
                    }
                },
                intervalMs,
            );
        });

        let maxLineWidth;

        function init() {
            asyncResult(
                () => document.body.clientWidth,
                clientWidth => clientWidth > 0,
            ).
            then(clientWidth => { maxLineWidth = clientWidth * 0.9 }).
            then(update).
            catch(console.error);
        }

        let running = false;
        async function update() {
            const words = text().split(separator);
            const widths = words.map(getWidth);
            const spaceWidth = getWidth(separator);
            // Greedy pack under `limit`. No line exceeds it unless a single word does.
            const wrap = limit => {
                const lines = [];
                let line = [], width = 0;
                words.forEach((word, index) => {
                    const extra = line.length ? spaceWidth + widths[index] : widths[index];
                    if (line.length && width + extra > limit) {
                        lines.push(line);
                        line = [word];
                        width = widths[index];
                    } else {
                        line.push(word);
                        width += extra;
                    }
                });
                return lines.concat([line]);
            };
            // Fewest lines that fit, then the narrowest limit still reaching that
            // count - which is what balances them. Binary search, to the pixel.
            const nrLines = wrap(maxLineWidth).length;
            let low = 0, high = Math.max(maxLineWidth, ...widths);
            while (high - low > 1) {
                const middle = (low + high) / 2;
                if (wrap(middle).length <= nrLines) high = middle; else low = middle;
            }
            const lines = wrap(high).map(line => line.join(separator));
            input.style.width = `${Math.max(...lines.map(getWidth)) || 3}px`;
            input.style.height = `${getHeight("a") * (lines.length || 1)}px`;
            input.value = lines.join(linesSeparator);


            if (running) return; // MAYBE: true mutex
            running = true;
            await new Promise(resolve => setTimeout(resolve, 500));

            const inputVal = text();
            document.title = inputVal;
            history.replaceState(null, null, '#' + inputVal);

            running = false;
        }

        (() => {
            const css = (element, property) => window.getComputedStyle(element, null).getPropertyValue(property);
            span.style.fontFamily = css(input, 'font-family');
            span.style.fontSize   = css(input, 'font-size');
        })();

        init();
        // document.addEventListener("DOMContentLoaded", init);
    </script>
    <script type="text/javascript">
        function setFavicon(href) {
            document.getElementById("favicon").setAttribute('href', href);
        }
        const icons = ['red', 'orange', 'yellow', 'lightgreen', 'green', 'lightblue', 'blue'];
        const icon = icons[Math.floor(Math.random() * icons.length)];
        setFavicon(`${window.location.origin}${window.location.pathname}favicons/${icon}.ico`);
    </script>
    <script type="text/javascript">
        const version_key = "version";
        const getVersion = () => window.localStorage.getItem(version_key);
        const updateVersion = () => {
            const d = new Date();
            const pad = value => value.toString().padStart(2, '0');
            const _ = method => pad(d["get" + method]());
            window.localStorage.setItem(
                version_key,
                `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${_("Date")} ${_("Hours")}:${_("Minutes")}:${_("Seconds")}`,
            );
        };

        const getSet = (key, value) => {
            const stored = window.sessionStorage.getItem(key);
            window.sessionStorage.setItem(key, value ? "1" : "0");
            return stored === "1";
        };
        const getSetAutoReloaded = value => getSet("auto-reloaded", value);
        if (!!getSet("reloaded", true) && !getSetAutoReloaded(false)) updateVersion();
        const currentVersion = getVersion();
        console.log(currentVersion);

        window.setInterval(
            () => {
                if (getVersion() !== currentVersion) {
                    getSetAutoReloaded(true);
                    window.location.reload();
                }
            },
            1000,
        );
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('service-worker.js')
                .catch(console.error);
        }
    </script>
</html>
